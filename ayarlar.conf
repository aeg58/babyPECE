# ayarlar.conf — bütün eşikler, yollar ve sabitler
#
# BAĞLAYICI: hiçbir sayı, yol ya da önek betiğin içine yazılmaz. Betikler bu dosyayı okur.
# (Aynı değer iki yerde durursa biri bayatlar; bir önceki sürümde tek bir tavanın üç ayrı
#  yerde üç farklı değeri vardı.)
#
# Bu dosya kurulumda doldurulur. Boş bırakılan eşik "ölçülmüyor" demektir, "sınırsız" değil.

# ── Kimlik ────────────────────────────────────────────────────────────────────
CALISMA_ADI="babyPECE"
# KAYIT_ONEKI=""            # konu dışı — görev kayıtları modülü kapalı (M_GOREV_KAYITLARI=0)
KAYIT_BASAMAK="3"           # 001 · 0001 …

# ── Eşikler (kurulumda sorulur; boş = ölçülmez) ───────────────────────────────
KURAL_TAVANI="450"             # CLAUDE.md satır
REFLEKS_TAVANI="18"           # yürürlükteki madde (emekli yuvalar sayılmaz)
REFLEKS_SATIR_TAVANI="180"     # aynı dosyanın satırı — madde sabitken satır şişebilir
DEVIR_TAVANI="90"             # DEVIR-NOTU.md satır
OKUMA_YUKU_HEDEFI="35000"        # oturum başı toplam bayt
PENCERE_GUN="45"              # kronolojik defterlerde tutulan gün

# ── Okuma listesi — sırayla ───────────────────────────────────────────────────
# Makinenin ÜRETEBİLDİĞİ hiçbir şey buraya yazılmaz. Her oturumda gerekmeyen de yazılmaz.
OKUMA_LISTESI="docs/DEVIR-NOTU.md CLAUDE.md docs/REFLEKSLER.md docs/BEKLEYENLER.md"

# ── Kural ve kayıt dosyaları ──────────────────────────────────────────────────
KURAL_DOSYASI="CLAUDE.md"
DERS_DOSYASI="docs/KURUCU-DERSLER.md"
REFLEKS_DOSYASI="docs/REFLEKSLER.md"
DEVIR_DOSYASI="docs/DEVIR-NOTU.md"
KAPSAM_DOSYASI="docs/KAPSAM.md"

# ── Modüller — kurulumda açılır (1) / kapalı (0) ──────────────────────────────
M_SURUM_KONTROLU="1"
M_UZAK_DEPO="0"
M_ORTAM_GECISLERI="0"
M_GORSEL_YUZEY="0"
M_GOREV_KAYITLARI="0"
M_PARALEL_OTURUM="0"
M_DIS_PAYDAS="0"
M_OLCUM_ARACLARI="0"
M_OLAY_GERI_ALMA="1"

# ── Sürüm kontrolü (M_SURUM_KONTROLU=1 ise) ───────────────────────────────────
ANA_DAL="main"                  # boşsa origin/HEAD'den okunur, o da yoksa ELLE
KORUNAN_DALLAR="main"           # boşsa ANA_DAL kullanılır
IS_DALI_ONEKLERI="is/"
# Kod tanımı BEYAZ LİSTE ile: aşağıdakiler DIŞINDAKİ her yol koddur.
# (Kara liste kullanan bir önceki sürümde Python, Go, Rust ve düz HTML korumasızdı.)
KOD_DISI_YOLLAR="docs/ *.md LICENSE .gitignore ayarlar.conf"

# ── Görev kayıtları (M_GOREV_KAYITLARI=1 ise) ─────────────────────────────────
KAYIT_KLASORU="docs/gorevler"
KAYIT_INDEKSI="docs/GOREV-INDEX.md"

# ── Rapor klasörleri ──────────────────────────────────────────────────────────
ACILIS_KLASORU="docs/oturum-basi"
KAPANIS_KLASORU="docs/oturum-sonu"
ARSIV_KLASORU="docs/arsiv"
